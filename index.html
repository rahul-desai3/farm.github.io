<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Fresh, locally grown produce from our farm."
  />
  <title>Rhizome Farm</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      color: white;
      background: #204620;
    }
    
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(
          to bottom,
          rgba(8, 27, 14, 0.52) 0%,
          rgba(8, 27, 14, 0.42) 38%,
          rgba(8, 27, 14, 0.78) 100%
        ),
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.28) 0%,
          rgba(0, 0, 0, 0.08) 65%,
          rgba(0, 0, 0, 0.16) 100%
        ),
        url("farm.jpeg") center / cover no-repeat;
    }
    
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem clamp(1.25rem, 5vw, 5rem);
      background: rgba(20, 65, 29, 0.5);
    }

    .logo {
      color: white;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 1.25rem;
    }

    nav a {
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
    }

    nav a:hover {
      color: #d7f5bb;
    }

    .content {
      width: min(850px, calc(100% - 2.5rem));
      margin: auto auto 0;
      padding: 5rem 0 clamp(2rem, 6vw, 5rem);
    }

    .tagline {
      margin: 0 0 0.85rem;
      color: #d7f5bb;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      line-height: 0.98;
      letter-spacing: -0.05em;
    }

    .intro {
      max-width: 570px;
      margin: 1.25rem 0 0;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 1.75rem;
      padding: 0.85rem 1.15rem;
      border: 2px solid #e8ffd5;
      border-radius: 0.45rem;
      color: #173718;
      background: #e8ffd5;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .button:hover {
      background: white;
      transform: translateY(-2px);
    }

    footer {
      padding: 1rem clamp(1.25rem, 5vw, 5rem);
      color: rgba(255, 255, 255, 0.82);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 520px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.75rem;
      }
    }

    h1,
    .intro,
    .tagline {
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.72);
    }
    
    .content {
      padding: 2rem;
      border-radius: 1rem;
      background: rgba(8, 27, 14, 0.2);
      backdrop-filter: blur(2px);
    }
  </style>
  <script>
    document.getElementById("contact-button").addEventListener("click", function () {
      const name = "contact.rhizome.co";
      const domain = "gmail.com";
      const email = name + "@" + domain;
  
      const subject = "Farm inquiry";
      const body =
        "Hello,\n\n" +
        "I would like to ask about:\n\n" +
        "Name:\n" +
        "Phone (optional):\n\n" +
        "Thank you.";
  
      window.location.href =
        "mailto:" +
        email +
        "?subject=" +
        encodeURIComponent(subject) +
        "&body=" +
        encodeURIComponent(body);
    });
  </script>
</head>

<body>
  <main class="hero">
    <header>
      <a class="logo" href="#">Rhizome Farm</a>

      <nav>
        <a href="#about">About</a>
        <a href="mailto:hello@example.com">Contact</a>
      </nav>
    </header>

    <section class="content" id="about">
      <p class="tagline">Grown with care</p>

      <h1>Fresh from our fields to your table.</h1>

      <p class="intro">
        We grow wholesome, high-quality produce with care for the land,
        our community, and every season.
      </p>

      <button class="button" id="contact-button" type="button">
        Get in touch
      </button>
    </section>

    <footer>
      © 2026 Rhizome Farm · Fresh, local, and naturally grown.
    </footer>
  </main>
</body>
</html>
